# term -> one-line definition. Rendered as tooltips app-wide and fed to agents.
Book value: What the balance sheet says the equity is worth — assets minus liabilities.
Current ratio: Current assets over current liabilities. Below ~1.5 is a solvency question.
Debt-to-equity: Total debt over shareholders' equity. How much of the business is borrowed.
Discounted cash flow: Valuing a business as the present value of the cash it will produce.
Earnings power value: Value based on sustainable current earnings, assuming no growth.
EV/EBIT: Enterprise value over operating profit. A multiple that ignores capital structure.
Falsifier: A specific, observable event that would prove your thesis wrong.
Free cash flow: Cash from operations minus capital expenditure — what the owner can actually take.
FCF yield: Free cash flow divided by market capitalisation. The cash return at today's price.
Gross margin: Revenue minus cost of goods sold, over revenue. Pricing power shows up here first.
Interest coverage: Operating profit over interest expense. How comfortably the debt is serviced.
Margin of safety: The gap between your estimate of value and the price you pay.
Moat: A durable reason competitors cannot compete away the returns.
Mr. Market: Graham's metaphor — a manic business partner quoting you a price every day.
Owner earnings: Buffett's measure — net income plus depreciation, minus real maintenance capex.
P/B: Price to book value.
P/E: Price over earnings per share. What you pay for a unit of current profit.
ROE: Net income over shareholders' equity. Return on the owners' capital.
ROIC: Operating profit after tax over invested capital. Return on all capital in the business.
Working capital: Current assets minus current liabilities — the cash tied up in running the business.
