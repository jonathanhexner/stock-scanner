# Value-investing criteria. Edit freely — the screener reads this at runtime.
# Each entry: a metric name, a comparison, and a weight for the composite score.
# Weights are relative; they're normalized at ranking time.

profitability:
  roe_min: 0.10           # return on equity >= 10%
  roic_min: 0.08          # return on invested capital >= 8%
  net_income_positive_years: 3

valuation:
  pe_max: 20.0            # trailing P/E
  pb_max: 3.0
  ev_ebitda_max: 12.0

quality:
  debt_to_equity_max: 1.0
  current_ratio_min: 1.5
  interest_coverage_min: 5.0

cash:
  fcf_positive_years: 3
  fcf_yield_min: 0.05     # free cash flow / market cap

growth:
  revenue_cagr_5y_min: 0.05
  eps_cagr_5y_min: 0.05

# Scoring weights for the composite rank. Higher = more important.
weights:
  profitability: 2.0
  valuation: 3.0
  quality: 2.0
  cash: 2.0
  growth: 1.0
